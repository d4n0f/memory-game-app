<!DOCTYPE html>
<html lang="hu">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Memória Mánia | Bejelentkezés</title>
	<link rel="stylesheet" href="{{ url_for('static', filename='main/menu/styles/login.css') }}">
	<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;700&family=Josefin+Slab:wght@700&display=swap" rel="stylesheet">
</head>

<body>
	<div class="login-title">MEMÓRIA MÁNIA</div>
	<div class="login-card">
		<div class="login-avatar">
			<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="5"/><path d="M12 14c-4.418 0-8 1.79-8 4v2h16v-2c0-2.21-3.582-4-8-4z"/></svg>
		</div>
		<input type="text" class="login-input" placeholder="Felhasználónév" data-cy="login-username" autocomplete="username">
		<input type="password" class="login-input" placeholder="Jelszó" data-cy="login-password" autocomplete="current-password">
		<button class="login-btn" data-cy="login-submit">Bejelentkezés</button>
	<div class="register-link" data-cy="register-link" onclick="window.location.href='/api/register'">Új felhasználó</div>
	<script src="{{ url_for('static', filename='main/menu/scripts/login.js') }}"></script>
	</div>
</body>

</html>
